 <div id="Services" *ngIf="!load.loading" class="container">

            <div class="col-12 col-sm-6 col-md-5 col-lg-3 d-flex align-items-stretch">

                            <img src="https://www.svgrepo.com/show/375320/html-document.svg " width="25%">
                        </div>
                    </div>

                    <div class="row d-flex justify-content-center mt-2 text-center">

                    </div>

                </div>

</div> 

<div *ngIf="load.loading" class="container">

    <div class="row d-flex justify-content-center pt-5">
        <div class="col-12 d-flex justify-content-center">
           <div class="placeholder " style=" width:214px ; height:75px ;"></div>
        </div>

        <div class="col-12 d-flex justify-content-center pt-2">
            <div class="placeholder " style=" width: 500px; "></div>

            <div class="placeholder " style=" width: 250px; "></div>
         </div>
    </div>
   


    <!-- cards -->
