<div *ngIf="!load.loading  " id="Homee" class="container">


  <div class="row align-items-center d-flex  py-5">
    <!-- Left Side Content -->
    <div class="col-9 col-lg-3 p-0 m-0">
      <div class="row align-items-center   ">
        <div class="col-2 px-0 col-sm-1  text-center align-items-center">
          <app-switch-toggle></app-switch-toggle>
        </div>
        <div class="col-10 col-sm-11 pl-2 position-relative  align-items-center text-start   ">
          <h4 class="text text-nowrap text-warning "> {{'NAME' | translate}}</h4>
        </div>
      </div>
    </div>



    <!-- Center Content -->
    <div class="col-7 d-none d-lg-block">
      <div class="row row-cols-6 d-flex  text-center align-items-center">
        <div class="col ">
          <button class="text-dark to-hover text-button" (click)="navigateToContact('Homee')">{{'HOME' |
            translate}}</button>
        </div>
        <div class="col p-0 text-nowrap">
          <button class="text-dark to-hover text-button" (click)="navigateToContact('Aboutme')">{{'ABOUT_ME' |
            translate}}</button>
        </div>
        <div class="col">
          <button class="text-dark to-hover text-button" (click)="navigateToContact('Services')">{{'SERVICES' |
            translate}}</button>
        </div>
        <div class="col">
          <button class="text-dark to-hover text-button" (click)="navigateToContact('Projects')">{{'PROJECTS' |
            translate}}</button>
        </div>
        <div class="col-2">
          <button class="text-dark to-hover text-button" (click)="navigateToContact('Testimonials')">
            {{'TESTIMONIALS'|translate}}</button>
        </div>
      </div>
    </div>

    <!-- Download CV Button -->
    <span class="col-1  d-none d-lg-block " [ngClass]="translater.isArabic ?'text-start' :'text-end'">
      <a href="https://drive.google.com/file/d/1EzjbBvnyenUxXLAnFs99aLXd_kmIKo25/view?usp=drive_link" target="_blank">
        <button class="btn btn-warning text-nowrap ">{{'DOWNLOAD_CV' | translate}}</button>
      </a>
    </span>

    <!--  <div class="col-2 col-lg-1 d-none justify-content-center">
      <app-lang-button></app-lang-button>
    </div> -->

    <div class="col-3 d-lg-none">
      <div class="row d-flex align-items-center text-end">
        <div class="col text-end d-flex align-items-center">
          <i class="bi bi-list w-100 text-dark" style="font-size: 25px;cursor: pointer;" (click)="showdash()"></i>
        </div>
      </div>

      <div *ngIf="showdashh" class="backdrop " (click)="showdash()"></div>

      <div id="sidebar" [ngClass]="{ 'show': showdashh, 'hide': !showdashh }"
        [ngStyle]="translater.isArabic ? {'left': '0'} : {'right': '0'}" class=" bg-sidebar pl-0">
        <ul class="p-0 text-bold">
          <div class="row">
            <div class="col-6 text-start">
              <div class="btn p-2" (click)="showdash()">
                <i class="bi bi-x-lg text-sidebar"></i>
              </div>
            </div>
            <div class="col-6"></div>
          </div>



          <li class=" border-side p-2 px-3 "
            [ngStyle]="translater.isArabic ? {'justify-content': 'end'} : {'justify-content': 'start'}">
            <button (click)="showdash() ; navigateToContact('Homee')" class="text-sidebar to-hover text-button">
              {{'HOME' |
              translate}}</button>
          </li>

          <li class=" border-side px-3 text-nowrap"
            [ngStyle]="translater.isArabic ? {'justify-content': 'end'} : {'justify-content': 'start'}">
            <button (click)="showdash() ; navigateToContact('Aboutme')" class="text-sidebar  to-hover text-button">
              {{'ABOUT_ME' |
              translate}}</button>
          </li>

          <li class=" border-side px-3 text-nowrap"
            [ngStyle]="translater.isArabic ? {'justify-content': 'end'} : {'justify-content': 'start'}">
            <button (click)="showdash() ; navigateToContact('Services')" class="text-sidebar  to-hover text-button">
              {{'SERVICES' |
              translate}}</button>
          </li>

          <li class=" border-side px-3 text-nowrap"
            [ngStyle]="translater.isArabic ? {'justify-content': 'end'} : {'justify-content': 'start'}">
            <button (click)="showdash() ; navigateToContact('Projects')" class="text-sidebar  to-hover text-button">
              {{'PROJECTS' |
              translate}}</button>
          </li>

          <li class=" border-side px-3 text-nowrap"
            [ngStyle]="translater.isArabic ? {'justify-content': 'end'} : {'justify-content': 'start'}">
            <button (click)="showdash() ; navigateToContact('Testimonials')" class="text-sidebar  to-hover text-button">
              {{'TESTIMONIALS' |
              translate}}</button>
          </li>



          <li class="border-side p-3"
            [ngStyle]="translater.isArabic ? {'justify-content': 'end'} : {'justify-content': 'start'}"><a 
              href="https://drive.google.com/file/d/1EzjbBvnyenUxXLAnFs99aLXd_kmIKo25/view?usp=drive_link"
              target="_blank"><button class="btn btn-warning text-nowrap">{{'DOWNLOAD_CV'
                |
                translate}}</button></a></li>



        </ul>

      </div>
    </div>
  </div>

</div>

<div *ngIf="load.loading" class="container">

  <div class="row d-flex  align-items-center pt-5 pl-5 ">

    <div class="col-4 ">
      <div class="placeholder px-2 rounded-circle" style="height:25px; width: 25px;"></div>
      <div class="placeholder w-50" style="height: 25px;"></div>
    </div>

    <div class="col-5  d-none d-lg-block">
      <div class="row row-cols-5 d-flex  align-items-center  ">
        <div class="col">
          <div class="placeholder w-75"></div>
        </div>
        <div class="col">
          <div class="placeholder w-75"></div>
        </div>
        <div class="col">
          <div class="placeholder w-75"></div>
        </div>
        <div class="col">
          <div class="placeholder w-75"></div>
        </div>
        <div class="col">
          <div class="placeholder w-100"></div>
        </div>


      </div>
    </div>


    <div class="col-3 d-none d-lg-block text-end">
      <div class="placeholder " style="height: 30px; width: 42%;"></div>
    </div>



    <div class="col-8 d-lg-none ">
      <div class="row d-flex  align-items-center text-end">

        <div class="col-12  text-end">
          <div class="placeholder " style="height: 30px; width: 30px;"></div>

        </div>

      </div>

      <div *ngIf="showdashh ===true">
        <div id="sidebar">
          <ul>
            <div class="row ">
              <div class="col-6 text-start">
                <div class="btn  p-2" (click)="showdash()">
                  <img src="https://www.svgrepo.com/show/532195/menu.svg" width="25" height="25">
                </div>
              </div>
              <div class="col-6">

              </div>
            </div>

            <li>
              <div class="placeholder">Home</div>
            </li>
            <li class="text-nowrap">
              <div class="placeholder">About us</div>
            </li>
            <li>
              <div class="placeholder">Services</div>
            </li>
            <li>
              <div class="placeholder">Projects</div>
            </li>
            <li>
              <div class="placeholder">Testimonials</div>
            </li>
            <li><button class="btn btn-body-bg text-nowrap text-start placeholder">Download CV</button></li>
          </ul>
        </div>
      </div>

      <!-- <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span><img src="https://www.svgrepo.com/show/532195/menu.svg"  width="25" height="25" alt=""></span> </button> -->
    </div>

  </div>

</div>
